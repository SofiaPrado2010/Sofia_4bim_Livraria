<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar pedido | Entre Páginas</title>
    <link rel="stylesheet" href="pagamento.css">
</head>

<body>
    <header>
        <h1>Entre Páginas</h1>
        <p>UM UNIVERSO DE HISTÓRIAS</p>
    </header>

    <main>
        <section class="pagamento">

            <h2>Confirmar pedido</h2>
            <p>Confira seus livros e os dados de entrega antes de confirmar.</p>

            <div class="resumo">
                <h3>Resumo do pedido 📚</h3>

                <div id="listaLivros">
                    <!-- Os livros serão exibidos aqui -->
                </div>

                <h3 class="total">
                    Total: <span id="valorTotal">R$ 0,00</span>
                </h3>
            </div>

            <div class="dados-entrega">

                <h3>Endereço de entrega 📍</h3>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Digite seu endereço" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Digite sua cidade" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" placeholder="Digite seu estado" required>
                </div>

            </div>

            <p>
                Após confirmar, seu pedido ficará pendente.
                Você terá 24 horas para realizar o pagamento.
            </p>

            <button id="btFinalizar">Confirmar pedido</button>
            <button id="btVoltar">Voltar à loja</button>

            <p id="mensagem"></p>

        </section>
    </main>

    <script src="pagamento.js"></script>

</body>

</html>
