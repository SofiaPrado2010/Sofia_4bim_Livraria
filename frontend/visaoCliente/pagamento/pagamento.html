<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra | Entre Páginas</title>
    <link rel="stylesheet" href="pagamento.css">
</head>

<body>
    <header>
        <h1>Entre Páginas</h1>
        <p>UM UNIVERSO DE HISTÓRIAS</p>
    </header>

    <main>
        <section class="pagamento">

            <h2>Finalizar compra</h2>
            <p>Estamos quase terminando! Confira seu pedido.</p>

            <div class="resumo">
                <h3>Resumo do pedido 📚</h3>

                <div id="listaLivros">
                    <!-- Os livros serão exibidos aqui -->
                </div>

                <h3 class="total">
                    Total: <span id="valorTotal">R$ 0,00</span>
                </h3>
            </div>

            <div class="dados-entrega">

                <h3>Endereço de entrega 📍</h3>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Digite seu endereço" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Digite sua cidade" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" placeholder="Digite seu estado" required>
                </div>

            </div>

            <div id="formasPagamento">

                <div class="pagamento-item">

                    <div class="campo">
                        <label>Forma de pagamento</label>

                        <select class="formaPagamento">
                            <option value="">Escolha uma opção</option>
                            <option value="PIX">PIX</option>
                            <option value="CREDITO">Cartão de crédito</option>
                            <option value="DEBITO">Cartão de débito</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Valor a pagar</label>
                        <input type="number" class="valorPagamento" placeholder="Digite o valor" min="0.01" step="0.01">
                    </div>

                    <div class="detalhesForma"></div>

                </div>

            </div>

            <button type="button" id="btAdicionarForma">
                + Adicionar outra forma de pagamento
            </button>

            <p>Valor restante: <strong id="valorRestante">R$ 0,00</strong></p>


            <!-- ÁREA DOS DADOS DE PAGAMENTO -->
            <div id="detalhesPagamentos"></div>

            <button id="btFinalizar">Confirmar compra</button>
            <button id="btVoltar">Voltar à loja</button>

            <p id="mensagem"></p>

        </section>
    </main>

    <script src="pagamento.js"></script>

</body>

</html>
