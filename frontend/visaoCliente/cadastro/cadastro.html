<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Entre Páginas</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <header>
        <h1>Entre Páginas</h1>
        <p>UM UNIVERSO DE HISTÓRIAS</p>
    </header>

    <main>
        <section class="cadastro">

            <h2>Crie sua conta</h2>

            <p>Preencha seus dados para fazer parte da nossa livraria!</p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" maxlength="11" placeholder="Somente números" required>
                </div>

                <div class="campo">
                    <label for="dataNascimento">Data de nascimento</label>
                    <input type="date" id="dataNascimento" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" placeholder="Digite sua cidade" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" maxlength="2" placeholder="Ex: PR" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" required>
                </div>

                <div class="campo">
                    <label for="usuario">Nome de usuário</label>
                    <input type="text" id="usuario" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" required>
                </div>

                <button type="submit" id="btCadastrar">
                    Criar conta
                </button>

                <p id="mensagem"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Entre Páginas - Todos os direitos reservados.</p>
    </footer>

    <script src="cadastro.js"></script>

</body>

</html>
